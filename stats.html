<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Consorcio - Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; padding: 24px; }
  .container { max-width: 700px; margin: 0 auto; }
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  h1 { font-size: 22px; font-weight: 700; }
  .subtitle { color: #8A8A96; font-size: 13px; margin-top: 4px; }
  .btn-group { display: flex; gap: 8px; }
  .refresh-btn { background: #C9A84C; color: #0A0A0F; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
  .refresh-btn:hover { background: #D4B65E; }
  .reset-btn { background: transparent; color: #ff6b6b; border: 1px solid rgba(255,75,75,0.3); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12px; }
  .reset-btn:hover { background: rgba(255,75,75,0.1); }

  .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: #13131A; border-radius: 10px; padding: 4px; }
  .tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: #8A8A96; transition: all 0.2s; }
  .tab:hover { color: #ccc; }
  .tab.active { background: #C9A84C; color: #0A0A0F; }
  .tab .tab-icon { font-size: 16px; display: block; margin-bottom: 2px; }

  .cards { display: flex; gap: 12px; margin-bottom: 36px; }
  .card { background: #13131A; border: 1px solid rgba(201,168,76,0.15); border-radius: 12px; padding: 18px; flex: 1; text-align: center; }
  .card-value { font-size: 28px; font-weight: 700; color: #C9A84C; }
  .card-label { font-size: 11px; color: #8A8A96; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #D4B65E; }

  .funnel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .funnel-num { font-size: 11px; color: #555; width: 20px; text-align: right; }
  .funnel-name { font-size: 12px; width: 140px; min-width: 140px; color: #ccc; }
  .funnel-bar-bg { flex: 1; background: #1a1a24; border-radius: 4px; height: 28px; position: relative; overflow: hidden; }
  .funnel-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; position: relative; }
  .funnel-bar-count { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 600; color: #fff; }
  .funnel-pct { font-size: 13px; font-weight: 700; width: 44px; text-align: right; }

  .drop-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; padding: 2px 0; }
  .drop-spacer { width: 170px; min-width: 170px; }
  .drop-line { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .drop-arrow { color: #ff4d4d; font-size: 10px; }
  .drop-text { font-size: 10px; color: #ff6b6b; font-weight: 500; }
  .drop-text-green { font-size: 10px; color: #4ade80; font-weight: 500; }

  .no-data { text-align: center; padding: 60px; color: #555; font-size: 14px; }
  .loading { text-align: center; padding: 60px; color: #555; }
  .error-msg { text-align: center; padding: 40px; color: #ff6b6b; font-size: 13px; }

  .worst-box { background: #1a0a0a; border: 1px solid rgba(255,75,75,0.2); border-radius: 10px; padding: 16px; margin-top: 28px; }
  .worst-title { font-size: 13px; font-weight: 600; color: #ff6b6b; margin-bottom: 8px; }
  .worst-text { font-size: 12px; color: #ccc; line-height: 1.6; }
  .worst-highlight { color: #ff6b6b; font-weight: 700; }

  .leads-section { margin-top: 40px; }
  .leads-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  .leads-table th { text-align: left; font-size: 11px; color: #8A8A96; text-transform: uppercase; letter-spacing: 1px; padding: 10px 12px; border-bottom: 1px solid #222; }
  .leads-table td { font-size: 13px; padding: 10px 12px; border-bottom: 1px solid #1a1a24; color: #ccc; }
  .leads-table tr:hover td { background: #13131A; }
  .status-ok { color: #4ade80; font-weight: 600; }
  .status-err { color: #ff6b6b; font-weight: 600; }
  .leads-count { font-size: 12px; color: #555; margin-left: 8px; font-weight: 400; }
  .path-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
  .path-imovel { background: rgba(74,222,128,0.15); color: #4ade80; }
  .path-carta { background: rgba(201,168,76,0.15); color: #C9A84C; }
  .path-veiculo { background: rgba(96,165,250,0.15); color: #60a5fa; }

  .leads-table tr.lead-row { cursor: pointer; }
  .leads-table tr.lead-row:hover td { background: #1a1a24; }
  .lead-toggle { color: #555; font-size: 10px; transition: transform 0.2s; display: inline-block; margin-right: 6px; }
  .lead-row.open .lead-toggle { transform: rotate(90deg); }
  .lead-detail { display: none; }
  .lead-row.open + .lead-detail { display: table-row; }
  .lead-detail td { padding: 8px 12px 16px 12px; border-bottom: 1px solid #222; }
  .detail-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .detail-item { background: #1a1a24; border-radius: 6px; padding: 8px 12px; flex: 1 1 45%; min-width: 140px; }
  .detail-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  .detail-value { font-size: 12px; color: #ccc; font-weight: 500; }
</style>
</head>
<body>
<div class="container">
  <div class="header-row">
    <div>
      <h1>Quiz Consorcio</h1>
      <div class="subtitle">Dashboard de conversao</div>
    </div>
    <div class="btn-group">
      <button class="refresh-btn" onclick="loadDashboard()">Atualizar</button>
      <button class="reset-btn" onclick="resetData()">Zerar dados</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('imovel')" id="tab-imovel"><span class="tab-icon">🏠</span>Imóvel</div>
    <div class="tab" onclick="switchTab('carta')" id="tab-carta"><span class="tab-icon">💰</span>Carta</div>
    <div class="tab" onclick="switchTab('veiculo')" id="tab-veiculo"><span class="tab-icon">🚗</span>Veículo</div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-value" id="totalSessions">-</div>
      <div class="card-label">Sessoes</div>
    </div>
    <div class="card">
      <div class="card-value" id="totalComplete">-</div>
      <div class="card-label">Completos</div>
    </div>
    <div class="card">
      <div class="card-value" id="conversionRate">-</div>
      <div class="card-label">Conversao</div>
    </div>
  </div>

  <div class="section-title">Funil por etapa</div>
  <div id="funnelChart"><div class="loading">Carregando...</div></div>

  <div id="worstDrop"></div>

  <div class="leads-section">
    <div class="section-title">Leads recebidos <span class="leads-count" id="leadsCount"></span></div>
    <div id="leadsTable"></div>
  </div>
</div>

<script>
const API = 'https://modernlookingbettafish-n8n.cloudfy.live/webhook/quiz-dashboard';
let dashboardData = null;
let currentTab = 'imovel';

const barColors = [
  '#4ade80', '#3ecf72', '#38c466', '#2eb85a',
  '#C9A84C', '#c4a044', '#be983c', '#b89034',
  '#ff8c42', '#ff7b3a', '#ff6b6b', '#ff5252', '#22c55e'
];

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (dashboardData) renderFunnel(dashboardData);
}

function toggleLead(el) {
  el.classList.toggle('open');
}

function renderLeads(leads) {
  const leadsDiv = document.getElementById('leadsTable');
  const leadsCountEl = document.getElementById('leadsCount');
  if (leads.length === 0) {
    leadsDiv.innerHTML = '<div class="no-data">Nenhum lead ainda.</div>';
    leadsCountEl.textContent = '';
  } else {
    leadsCountEl.textContent = '(' + leads.length + ')';
    const reversed = [...leads].reverse();
    let thtml = '<table class="leads-table"><thead><tr><th>Nome</th><th>Telefone</th><th>Funil</th><th>Data</th><th>Status</th></tr></thead><tbody>';
    for (const l of reversed) {
      const statusClass = l.status === 'enviado' ? 'status-ok' : 'status-err';
      const statusIcon = l.status === 'enviado' ? '✅' : '❌';
      const pathClass = 'path-' + (l.path || 'imovel');
      const pathLabel = l.path || '-';
      const r = l.respostas || {};
      const hasRespostas = Object.keys(r).length > 0;

      thtml += '<tr class="lead-row" onclick="toggleLead(this)"><td><span class="lead-toggle">▶</span>' + l.nome + '</td><td>' + l.telefone + '</td><td><span class="path-badge ' + pathClass + '">' + pathLabel + '</span></td><td>' + l.data + '</td><td class="' + statusClass + '">' + statusIcon + ' ' + l.status + '</td></tr>';

      if (hasRespostas) {
        thtml += '<tr class="lead-detail"><td colspan="5"><div class="detail-grid">';
        if (r.tempo_contemplacao) thtml += '<div class="detail-item"><div class="detail-label">Tempo contemplação</div><div class="detail-value">' + r.tempo_contemplacao + '</div></div>';
        if (r.valor_carta) thtml += '<div class="detail-item"><div class="detail-label">Valor carta</div><div class="detail-value">' + r.valor_carta + '</div></div>';
        if (r.valor_parcela) thtml += '<div class="detail-item"><div class="detail-label">Parcela</div><div class="detail-value">' + r.valor_parcela + '</div></div>';
        if (r.objecao) thtml += '<div class="detail-item"><div class="detail-label">Objeção</div><div class="detail-value">' + r.objecao + '</div></div>';
        if (r.ancora) thtml += '<div class="detail-item"><div class="detail-label">Âncora prazo</div><div class="detail-value">' + r.ancora + '</div></div>';
        if (r.urgencia) thtml += '<div class="detail-item"><div class="detail-label">Urgência</div><div class="detail-value">' + r.urgencia + '</div></div>';
        thtml += '</div></td></tr>';
      }
    }
    thtml += '</tbody></table>';
    leadsDiv.innerHTML = thtml;
  }
}

function renderFunnel(data) {
  const chart = document.getElementById('funnelChart');
  const funnels = data.funnels || {};
  const funnelData = funnels[currentTab];

  if (!funnelData || !funnelData.funnel || funnelData.funnel.length === 0) {
    chart.innerHTML = '<div class="no-data">Nenhum dado para este funil.<br>Acesse o quiz para gerar dados.</div>';
    document.getElementById('totalSessions').textContent = '0';
    document.getElementById('totalComplete').textContent = '0';
    document.getElementById('conversionRate').textContent = '0%';
    document.getElementById('worstDrop').innerHTML = '';
    return;
  }

  const funnel = funnelData.funnel;
  const total = funnelData.total_sessions || 0;
  const complete = funnelData.total_complete || 0;
  const rate = total > 0 ? Math.round((complete / total) * 100) : 0;

  document.getElementById('totalSessions').textContent = total;
  document.getElementById('totalComplete').textContent = complete;
  document.getElementById('conversionRate').textContent = rate + '%';

  if (total === 0) {
    chart.innerHTML = '<div class="no-data">Nenhum dado para este funil.<br>Acesse o quiz para gerar dados.</div>';
    document.getElementById('worstDrop').innerHTML = '';
    return;
  }

  let html = [];
  let worstDrop = { from: '', to: '', pct: 0, idx: 0 };

  for (let i = 0; i < funnel.length; i++) {
    const f = funnel[i];
    const barColor = barColors[i] || '#C9A84C';
    const nextCount = i < funnel.length - 1 ? funnel[i + 1].count : f.count;
    const stepPct = f.count > 0 ? Math.min(100, Math.round((nextCount / f.count) * 100)) : 0;

    html.push(
      '<div class="funnel-row">' +
        '<div class="funnel-num">' + f.step + '</div>' +
        '<div class="funnel-name">' + f.name + '</div>' +
        '<div class="funnel-bar-bg">' +
          '<div class="funnel-bar-fill" style="width:' + Math.max(stepPct, 3) + '%;background:' + barColor + '30;border-left:3px solid ' + barColor + ';"></div>' +
          '<span class="funnel-bar-count">' + f.count + '</span>' +
        '</div>' +
        '<div class="funnel-pct" style="color:' + barColor + '">' + stepPct + '%</div>' +
      '</div>'
    );

    if (i < funnel.length - 1 && f.count > 0) {
      const next = funnel[i + 1];
      const drop = f.count - next.count;
      const dropPct = Math.round((drop / f.count) * 100);

      if (drop > 0) {
        html.push(
          '<div class="drop-row"><div class="drop-spacer"></div><div class="drop-line">' +
            '<span class="drop-arrow">▼</span>' +
            '<span class="drop-text">-' + drop + ' saiu (' + dropPct + '% perdeu)</span>' +
          '</div></div>'
        );
        if (dropPct > worstDrop.pct) {
          worstDrop = { from: f.name, to: next.name, pct: dropPct, count: drop, idx: f.step };
        }
      } else {
        html.push(
          '<div class="drop-row"><div class="drop-spacer"></div><div class="drop-line">' +
            '<span class="drop-text-green">↓ 0 saiu</span>' +
          '</div></div>'
        );
      }
    }
  }

  chart.innerHTML = html.join('');

  const worstBox = document.getElementById('worstDrop');
  if (worstDrop.pct > 0) {
    worstBox.innerHTML =
      '<div class="worst-box"><div class="worst-title">⚠ Maior ponto de saida</div>' +
      '<div class="worst-text">Entre <strong>' + worstDrop.from + '</strong> e <strong>' + worstDrop.to + '</strong>: ' +
      '<span class="worst-highlight">' + worstDrop.count + ' leads sairam (' + worstDrop.pct + '%)</span><br>' +
      'Considere melhorar a tela ' + worstDrop.idx + ' para reduzir abandono.</div></div>';
  } else {
    worstBox.innerHTML = '';
  }
}

async function loadDashboard() {
  const chart = document.getElementById('funnelChart');
  chart.innerHTML = '<div class="loading">Carregando...</div>';

  try {
    const res = await fetch(API);
    const data = await res.json();
    dashboardData = data;

    renderLeads(data.leads || []);
    renderFunnel(data);

  } catch(e) {
    chart.innerHTML = '<div class="error-msg">Erro ao carregar dados.<br>Verifique se os workflows estao ativos no n8n.</div>';
  }
}

async function resetData() {
  if (!confirm('Zerar TODOS os dados dos 3 funis + leads?')) return;
  try {
    await fetch('https://modernlookingbettafish-n8n.cloudfy.live/webhook/quiz-stats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'reset', step: 0 })
    });
    setTimeout(loadDashboard, 2000);
  } catch(e) {
    alert('Erro ao zerar dados');
  }
}

loadDashboard();
</script>
</body>
</html>
