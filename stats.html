<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Consorcio - Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; padding: 24px; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 700; }
  .subtitle { color: #8A8A96; font-size: 14px; margin-bottom: 32px; }
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .refresh-btn { background: #C9A84C; color: #0A0A0F; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
  .refresh-btn:hover { background: #D4B65E; }
  .stats-row { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .stat-card { background: #13131A; border: 1px solid rgba(201,168,76,0.15); border-radius: 12px; padding: 20px; flex: 1; min-width: 150px; }
  .stat-value { font-size: 32px; font-weight: 700; color: #C9A84C; }
  .stat-label { font-size: 12px; color: #8A8A96; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .funnel-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .funnel-step { display: flex; align-items: center; margin-bottom: 8px; gap: 12px; }
  .funnel-label { font-size: 13px; width: 180px; min-width: 180px; }
  .funnel-bar-wrap { flex: 1; background: #1a1a24; border-radius: 6px; height: 36px; position: relative; overflow: hidden; }
  .funnel-bar { height: 100%; border-radius: 6px; display: flex; align-items: center; padding: 0 12px; transition: width 0.6s ease; }
  .funnel-bar-text { font-size: 12px; font-weight: 600; white-space: nowrap; position: absolute; left: 12px; z-index: 1; }
  .funnel-pct { font-size: 14px; font-weight: 700; width: 52px; text-align: right; color: #C9A84C; }
  .drop { font-size: 11px; color: #ff6b6b; text-align: center; margin: 2px 0 6px; padding-left: 192px; }
  .no-data { text-align: center; padding: 60px; color: #8A8A96; }
  .error-msg { text-align: center; padding: 40px; color: #ff6b6b; font-size: 14px; }
  .loading { text-align: center; padding: 60px; color: #8A8A96; }
</style>
</head>
<body>
<div class="container">
  <div class="header-row">
    <div>
      <h1>Quiz Consorcio</h1>
      <div class="subtitle">Dashboard de conversao</div>
    </div>
    <button class="refresh-btn" onclick="loadDashboard()">Atualizar</button>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="totalSessions">-</div>
      <div class="stat-label">Sessoes</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalComplete">-</div>
      <div class="stat-label">Completos</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="conversionRate">-</div>
      <div class="stat-label">Taxa conversao</div>
    </div>
  </div>

  <div class="funnel-title">Funil por etapa</div>
  <div id="funnelChart"><div class="loading">Carregando...</div></div>
</div>

<script>
const API = 'https://modernlookingbettafish-n8n.cloudfy.live/webhook/quiz-dashboard';

const colors = [
  '#4ade80', '#3ecf72', '#38c466', '#2eb85a',
  '#C9A84C', '#c4a044', '#be983c', '#b89034',
  '#ff8c42', '#ff7b3a', '#ff6b6b', '#ff5252', '#22c55e'
];

async function loadDashboard() {
  const chart = document.getElementById('funnelChart');
  chart.innerHTML = '<div class="loading">Carregando...</div>';

  try {
    const res = await fetch(API);
    const data = await res.json();

    document.getElementById('totalSessions').textContent = data.total_sessions || 0;
    document.getElementById('totalComplete').textContent = data.total_complete || 0;
    document.getElementById('conversionRate').textContent = (data.conversion_rate || 0) + '%';

    if (!data.funnel || data.funnel.length === 0 || data.total_sessions === 0) {
      chart.innerHTML = '<div class="no-data">Nenhum dado ainda.<br>Acesse o quiz para gerar dados.</div>';
      return;
    }

    let html = [];
    const funnel = data.funnel;

    for (let i = 0; i < funnel.length; i++) {
      const f = funnel[i];
      const barColor = colors[i] || '#C9A84C';

      html.push(`
        <div class="funnel-step">
          <div class="funnel-label">${f.step}. ${f.name}</div>
          <div class="funnel-bar-wrap">
            <div class="funnel-bar" style="width: ${Math.max(f.pct, 2)}%; background: ${barColor}20; border: 1px solid ${barColor}50;"></div>
            <span class="funnel-bar-text">${f.count} sessoes</span>
          </div>
          <div class="funnel-pct">${f.pct}%</div>
        </div>
      `);

      if (i < funnel.length - 1 && f.count > 0 && funnel[i+1].count < f.count) {
        const drop = f.count - funnel[i+1].count;
        const dropPct = Math.round((drop / f.count) * 100);
        if (dropPct > 0) {
          html.push(`<div class="drop">&#9660; ${drop} sairam (${dropPct}%)</div>`);
        }
      }
    }

    chart.innerHTML = html.join('');

  } catch(e) {
    chart.innerHTML = '<div class="error-msg">Erro ao carregar dados.<br>Verifique se o workflow "Quiz Dashboard - Funil" esta ativo no n8n.</div>';
  }
}

loadDashboard();
</script>
</body>
</html>
